name: Home Music checks

# Feature-scoped exception to the owner's GitHub Actions cost pause.
# Use the marker only for an explicitly authorized Home Music CI run.
on:
  push:
    branches:
      - codex/home-music

permissions:
  contents: read

concurrency:
  group: home-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-music:
    if: contains(github.event.head_commit.message, '[home-music ci]')
    name: Android and music preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Prepare Android SDK and audio tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;34.0.0"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Verify library preparation and real audio transforms
        run: |
          python3 -m unittest server.tests.test_prepare_library
          python3 -m server.tests.smoke_audio

      - name: Test Android and shared policy, then build debug APK
        run: ./gradlew --no-daemon :shared:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug
