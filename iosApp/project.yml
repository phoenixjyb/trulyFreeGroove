name: OpenGroove
options:
  bundleIdPrefix: com.trulyfreemusic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  OpenGroove:
    type: application
    platform: iOS
    sources:
      - path: OpenGroove
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenGroove/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.trulyfreemusic.opengroove.ios
        PRODUCT_NAME: OpenGroove
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.3.0
        JAMENDO_CLIENT_ID: ""
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework OpenGrooveShared"
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "${OPEN_GROOVE_SKIP_SHARED_BUILD:-0}" = "1" ]; then
            echo "Using the existing OpenGrooveShared framework for this verification build."
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  OpenGrooveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwiftTests
    dependencies:
      - target: OpenGroove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trulyfreemusic.opengroove.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework OpenGrooveShared"
schemes:
  OpenGroove:
    build:
      targets:
        OpenGroove: all
        OpenGrooveTests: [test]
    test:
      targets:
        - OpenGrooveTests
